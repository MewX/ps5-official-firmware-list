# TEMPORARY workflow for the issue #8 investigation: probes Sony's PS5 update
# service from a runner with unrestricted network access.
# Delete once the results have been collected.
name: Region probe (temporary)

on:
  push:
    branches:
      - claude/issue-8-investigation-mtb005
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Phase 1 - every code, path segment + host DNS
        run: bash region_probe.sh probe_out

      - name: Phase 1 - report
        run: python3 region_report.py probe_out | tee probe_out/report.txt

      - name: Phase 2 - host vs path segment, and token sensitivity
        shell: bash +e {0}
        run: |
          TOKEN=tJMRE80IbXnE9YuG0jzTXgKEjIMoabr6
          get() { curl -sS --max-time 15 "$1" 2>/dev/null; }
          code() { curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "$1" 2>/dev/null || echo ERR; }
          {
            echo "== Cross matrix: every resolving f*01 host x every serving /list/<cc>/ =="
            hosts="au br cn jp ru sa uk us eu kr mx tw"
            lists=$(awk -F'\t' 'NR>1 && $4==200 {print $1}' probe_out/results.tsv | tr '\n' ' ')
            echo "serving list segments: $lists"
            printf '%-8s' "host\\list"; for l in $lists; do printf '%-14s' "$l"; done; echo
            for h in $hosts; do
              printf 'f%-7s' "${h}01"
              for l in $lists; do
                u="http://f${h}01.ps5.update.playstation.net/update/ps5/official/${TOKEN}/list/${l}/updatelist.xml"
                b=$(get "$u"); s=$(printf '%s' "$b" | sha256sum | cut -c1-8)
                r=$(printf '%s' "$b" | grep -o '<region id="[^"]*"' | head -1 | sed 's/.*id="//;s/"//')
                printf '%-14s' "${r:-x}/$s"
              done
              echo
            done
            echo
            echo "== Token sensitivity =="
            for t in "$TOKEN" "TJMRE80IbXnE9YuG0jzTXgKEjIMoabr6" "tJMRE80IbXnE9YuG0jzTXgKEjIMoabr" "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" "x" ""; do
              u="http://fus01.ps5.update.playstation.net/update/ps5/official/${t}/list/us/updatelist.xml"
              printf 'token=%-34s http=%s\n' "${t:-(empty)}" "$(code "$u")"
            done
            echo
            echo "== ?dest= sensitivity on the PUP download (HEAD) =="
            base="http://dus01.ps5.update.playstation.net/update/ps5/official/${TOKEN}/image/2026_0909/sys_1eb4b18451e0f064fc23b5bd4c95cae7f6489f9ad1148b5dfb0d66452a108ebc/PS5UPDATE.PUP"
            for q in "?dest=us" "?dest=jp" "?dest=zz" "?dest=" ""; do
              printf 'dest=%-12s http=%s\n' "${q:-(none)}" \
                "$(curl -sS -I --max-time 20 -o /dev/null -w '%{http_code}' "${base}${q}" </dev/null 2>/dev/null || echo ERR)"
            done
            echo
            echo "== Cross-host download: fetch the us PUP from every d*01 host (first 1 MiB sha256) =="
            for h in au br cn jp ru sa uk us; do
              u="http://d${h}01.ps5.update.playstation.net/update/ps5/official/${TOKEN}/image/2026_0909/sys_1eb4b18451e0f064fc23b5bd4c95cae7f6489f9ad1148b5dfb0d66452a108ebc/PS5UPDATE.PUP?dest=us"
              s=$(curl -sS --max-time 60 -r 0-1048575 "$u" 2>/dev/null | sha256sum | cut -c1-16)
              printf 'd%-6s first1MiB=%s\n' "${h}01" "$s"
            done
            echo
            echo "== Other path shapes on a serving host =="
            for p in "list/us/updatelist.xml" "list/us/" "list/us" "list/updatelist.xml" "list//updatelist.xml" "list/us/update-list.xml"; do
              u="http://fus01.ps5.update.playstation.net/update/ps5/official/${TOKEN}/${p}"
              printf '%-34s http=%s\n' "/$p" "$(code "$u")"
            done
            echo
            echo "== Sibling consoles, same token =="
            for c in ps4 ps3 ps5; do
              for f in updatelist.xml update-list.xml; do
                u="http://fus01.${c}.update.playstation.net/update/${c}/official/${TOKEN}/list/us/${f}"
                printf '%-64s http=%s\n' "${u#http://}" "$(code "$u")"
              done
            done
          } | tee probe_out/cross_checks.txt

      - name: Phase 3 - response headers from a serving region
        shell: bash +e {0}
        run: |
          TOKEN=tJMRE80IbXnE9YuG0jzTXgKEjIMoabr6
          for cc in us jp uk cn; do
            echo "---- f${cc}01 /list/${cc}/ ----"
            curl -sS -I --max-time 15 \
              "http://f${cc}01.ps5.update.playstation.net/update/ps5/official/${TOKEN}/list/${cc}/updatelist.xml" \
              </dev/null 2>/dev/null | tr -d '\r'
          done | tee probe_out/headers.txt

      - name: Collect deduplicated results
        shell: bash +e {0}
        run: |
          rm -rf region-probe-results
          mkdir -p region-probe-results/xml
          cp probe_out/results.tsv probe_out/report.txt probe_out/cross_checks.txt \
             probe_out/headers.txt region-probe-results/ 2>/dev/null
          : > region-probe-results/groups.tsv
          for f in probe_out/xml/*.xml; do
            [ -e "$f" ] || continue
            cc=$(basename "$f" .xml)
            sum=$(sha256sum "$f" | cut -c1-12)
            printf '%s\t%s\n' "$cc" "$sum" >> region-probe-results/groups.tsv
            [ -e "region-probe-results/xml/$sum.xml" ] || cp "$f" "region-probe-results/xml/$sum.xml"
          done
          echo "Distinct bodies: $(ls region-probe-results/xml | wc -l)"
          echo "== results.tsv (served only) =="
          awk -F'\t' 'NR==1 || $4==200' region-probe-results/results.tsv

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: region-probe-results
          path: region-probe-results/

      - name: Commit results back to the branch
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f region-probe-results
          git commit -m "Region probe results (temporary, issue #8 investigation)" || exit 0
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_REF_NAME}"
